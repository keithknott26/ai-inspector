# SPDX-License-Identifier: GPL-2.0-or-later
#
# AI Inspector CI
#   unit-tests    fast: engine helpers + Qt UI components (no Wireshark needed)
#   plugin-build  full: builds the pinned Wireshark with both plugins, runs the
#                 TShark engine tests and the in-application UI self-test,
#                 and packages the result. Runs on main, tags and on demand
#                 because building Wireshark takes a while.

stages: [test, build]

variables:
  DEBIAN_FRONTEND: noninteractive
  QT_QPA_PLATFORM: offscreen

.ubuntu-deps: &ubuntu-deps
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      build-essential cmake ninja-build git ca-certificates python3 python3-pip python3-venv
      qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
      libqt6core5compat6-dev qt6-multimedia-dev libqt6svg6-dev libxkbcommon-dev
      libglib2.0-dev libpcap-dev libgcrypt20-dev libc-ares-dev libpcre2-dev
      libspeexdsp-dev zlib1g-dev libnghttp2-dev libxml2-dev libzstd-dev liblz4-dev
      libsnappy-dev flex bison ccache

unit-tests:
  <<: *ubuntu-deps
  stage: test
  script:
    - cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build-tests
    - ctest --test-dir build-tests --output-on-failure

plugin-build:
  <<: *ubuntu-deps
  stage: build
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  variables:
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: wireshark-ccache
    paths: [.ccache]
  script:
    - python3 -m pip install --break-system-packages scapy cryptography
    - sh tools/build-development.sh --build-dir build-development --gui-test
    - sh tools/package.sh --build-dir build-development
  artifacts:
    paths: [dist/]
    expire_in: 30 days

# Windows build (GitLab.com shared Windows runner or your own runner tagged "windows").
# Manual by default: it installs Qt and builds Wireshark from scratch (slow).
windows-build:
  stage: build
  tags: [saas-windows-medium-amd64]
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    QT_VERSION: "6.10.3"
    QT_DIR: 'C:\Qt\6.10.3\msvc2022_64'
  script:
    - choco install -y --no-progress winflexbison3 strawberryperl nsis asciidoctorj
    - python -m pip install aqtinstall
    - python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m qtmultimedia --outputdir C:\Qt
    - $env:PATH = "C:\Program Files (x86)\NSIS;C:\Strawberry\perl\bin;$env:PATH"
    - |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
      if (-not $vs) { & $vswhere -all -products * -format text; throw "No Visual Studio / Build Tools with the C++ x64 toolset found on this runner" }
      Write-Host "Using Visual Studio at $vs"
      $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
      cmd /c "`"$vcvars`" >nul && set" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] } }
      if (-not (Get-Command cl -ErrorAction SilentlyContinue)) { throw "cl.exe still not on PATH after vcvars64.bat" }
      .\tools\build-windows.ps1 -QtDir $env:QT_DIR -Installer
  artifacts:
    paths:
      - build-windows/packaging/nsis/Wireshark-*.exe
    expire_in: 30 days
