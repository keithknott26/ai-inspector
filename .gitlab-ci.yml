# SPDX-License-Identifier: GPL-2.0-or-later
#
# AI Inspector CI
#   unit-tests    fast: engine helpers + Qt UI components (no Wireshark needed)
#   plugin-build  full: builds the pinned Wireshark with both plugins, runs the
#                 TShark engine tests and the in-application UI self-test,
#                 and packages the result. Runs on main, tags and on demand
#                 because building Wireshark takes a while.

stages: [test, build]

variables:
  DEBIAN_FRONTEND: noninteractive
  QT_QPA_PLATFORM: offscreen

.ubuntu-deps: &ubuntu-deps
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      build-essential cmake ninja-build git ca-certificates python3 python3-pip
      qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
      libqt6core5compat6-dev qt6-multimedia-dev libqt6svg6-dev libxkbcommon-dev
      libglib2.0-dev libpcap-dev libgcrypt20-dev libc-ares-dev libpcre2-dev
      libspeexdsp-dev zlib1g-dev libnghttp2-dev libxml2-dev libzstd-dev liblz4-dev
      libsnappy-dev flex bison ccache

unit-tests:
  <<: *ubuntu-deps
  stage: test
  script:
    - cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build-tests
    - ctest --test-dir build-tests --output-on-failure

plugin-build:
  <<: *ubuntu-deps
  stage: build
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  variables:
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: wireshark-ccache
    paths: [.ccache]
  script:
    - python3 -m pip install --break-system-packages scapy cryptography
    - sh tools/build-development.sh --build-dir build-development --gui-test
    - sh tools/package.sh --build-dir build-development
  artifacts:
    paths: [dist/]
    expire_in: 30 days
