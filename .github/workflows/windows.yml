# SPDX-License-Identifier: GPL-2.0-or-later
#
# Windows build of Wireshark (pinned 4.7 revision) with the AI Inspector plugins.
#
# Produces:
#   Wireshark-*-x64.exe                        installer with AI Inspector included
#   ai-inspector-<ver>-wireshark-win64-portable.zip   unzip and run Wireshark.exe
#   ai-inspector-<ver>-win64-plugins.zip       just the two DLLs (only for this exact Wireshark build)
#
# Runs on version tags (v*), which also publish a GitHub Release, and on demand
# from the Actions tab ("Run workflow"). A full build takes roughly 1-2 hours.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.10.3"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  CONFIGURATION: RelWithDebInfo

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: choco install -y --no-progress winflexbison3 nsis xsltproc asciidoctorj

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $c = Get-Content cmake/AIInspectorVersion.cmake -Raw
          $v = "{0}.{1}.{2}" -f `
            [regex]::Match($c,'VERSION_MAJOR (\d+)').Groups[1].Value, `
            [regex]::Match($c,'VERSION_MINOR (\d+)').Groups[1].Value, `
            [regex]::Match($c,'VERSION_PATCH (\d+)').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # -Installer makes the script build every Wireshark target, stage the Qt
      # translation catalogs and run the NSIS packaging steps itself, so the local
      # and CI builds go through exactly the same path.
      - name: Build Wireshark + AI Inspector, run tests, package installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;C:\ProgramData\chocolatey\bin;$env:PATH"
          .\tools\build-windows.ps1 -QtDir $env:QT_ROOT_DIR -Configuration $env:CONFIGURATION `
            -ThirdPartyDir "C:\wireshark-third-party" -Installer

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.ver.outputs.version }}"
          $run = "build-windows\run\$env:CONFIGURATION"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Portable Wireshark with the plugins already in its plugin folder.
          # 7-Zip handles the deep paths and file count better than Compress-Archive.
          $portable = "dist\ai-inspector-$v-wireshark-win64-portable.zip"
          & 7z a -tzip -mx=5 -bso0 -bsp0 $portable "$run\*"
          if ($LASTEXITCODE) { throw "7z failed packing the portable build ($LASTEXITCODE)" }

          # Plugins only
          $stage = "stage\plugins"
          $engine = Get-ChildItem -Recurse $run -Filter ai_inspector_engine.dll | Select-Object -First 1
          $ui = Get-ChildItem -Recurse $run -Filter ai_inspector.dll | Select-Object -First 1
          if (-not $engine -or -not $ui) { throw "Built plugins not found under $run" }
          $verDir = Split-Path (Split-Path $engine.DirectoryName -Parent) -Leaf   # e.g. 4.7
          New-Item -ItemType Directory -Force "$stage\$verDir\epan", "$stage\$verDir\ui" | Out-Null
          Copy-Item $engine.FullName "$stage\$verDir\epan\"
          Copy-Item $ui.FullName "$stage\$verDir\ui\"
          Copy-Item README.md, LICENSE, CHANGELOG.md stage\
          & 7z a -tzip -mx=5 -bso0 -bsp0 "dist\ai-inspector-$v-win64-plugins.zip" "stage\*"
          if ($LASTEXITCODE) { throw "7z failed packing the plugins zip ($LASTEXITCODE)" }

          Copy-Item build-windows\packaging\nsis\Wireshark-*.exe dist\
          Get-ChildItem dist | Format-Table Name, Length

          # Every artifact must be present, or the run is not releasable.
          foreach ($pattern in @("Wireshark-*-x64.exe", "*-wireshark-win64-portable.zip", "*-win64-plugins.zip")) {
            if (-not (Get-ChildItem dist -Filter $pattern)) { throw "Missing artifact: $pattern" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-inspector-windows
          path: dist/*
          retention-days: 30

      # softprops/action-gh-release fails on Windows runners ("Error creating asset
      # temp dir"), so publish with the GitHub CLI, which is preinstalled.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "AI Inspector $tag" --generate-notes
          }
          if ($LASTEXITCODE) { throw "gh release failed ($LASTEXITCODE)" }
